name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib

      - name: 构建 C 内核
        run: |
          cmake -S csrc -B csrc/build -DCMAKE_BUILD_TYPE=Release
          cmake --build csrc/build -j"$(nproc)"

      - name: 单元测试
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: |
          for f in python/tests/test_*.py; do
            [ "$f" = "python/tests/test_gui.py" ] && continue
            echo "== $f"
            python "$f"
          done
          # GUI 测试需要显示与 tkinter；runner 上缺任何一个就明确跳过
          if python -c "import tkinter" 2>/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq xvfb
            xvfb-run -a python python/tests/test_gui.py
          else
            echo "::warning::tkinter 不可用，跳过 test_gui"
          fi

      - name: 解析基准
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: python python/scripts/analytic_benchmarks.py

      - name: 4-case 验证矩阵
        env:
          PYTHONPATH: ${{ github.workspace }}/python
        run: python python/scripts/validation_matrix.py
